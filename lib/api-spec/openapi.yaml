openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: marketplace
    description: Community marketplace operations
  - name: storage
    description: Media upload operations
  - name: locations
    description: Philippine location search operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /locations/search:
    get:
      operationId: searchLocations
      tags: [locations]
      summary: Search Philippine cities, municipalities, and barangays
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [City, Municipality, Barangay, Locality]
        - name: parent
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching Philippine locations
          content:
            application/json:
              schema:
                type: object
                required: [locations]
                properties:
                  locations:
                    type: array
                    items:
                      $ref: "#/components/schemas/LocationRecord"
        "400":
          description: Invalid location level
  /marketplace/posts:
    get:
      operationId: listMarketplacePosts
      tags: [marketplace]
      summary: List approved marketplace posts
      responses:
        "200":
          description: Approved marketplace posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplacePost"
    post:
      operationId: createMarketplacePost
      tags: [marketplace]
      summary: Submit a marketplace post for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketplacePostInput"
      responses:
        "201":
          description: Marketplace post submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplacePost"
        "400":
          description: Invalid post
  /marketplace/admin/posts:
    get:
      operationId: listMarketplaceAdminPosts
      tags: [marketplace]
      summary: List marketplace posts for moderation
      parameters:
        - $ref: "#/components/parameters/AdminChatId"
      responses:
        "200":
          description: All marketplace posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplacePost"
        "403":
          description: Owner access required
  /marketplace/admin/posts/{id}/moderate:
    post:
      operationId: moderateMarketplacePost
      tags: [marketplace]
      summary: Change a marketplace post moderation status
      parameters:
        - $ref: "#/components/parameters/AdminChatId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationInput"
      responses:
        "200":
          description: Moderated marketplace post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplacePost"
        "404":
          description: Post not found
  /storage/uploads/request-url:
    post:
      operationId: requestMediaUploadUrl
      tags: [storage]
      summary: Request a presigned media upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "400":
          description: Invalid media metadata
components:
  parameters:
    AdminChatId:
      name: X-Admin-Chat-Id
      in: header
      required: true
      schema:
        type: string
  schemas:
    LocationRecord:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
        level:
          type: string
          enum: [City, Municipality, Barangay]
        province:
          type: string
        region:
          type: string
        parent:
          type: string
      required: [value, label, level, province, region]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StoredMedia:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        name:
          type: string
        objectPath:
          type: ["string", "null"]
      required: [id, url, name]
    MarketplacePost:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
        type:
          type: string
        location:
          type: string
        category:
          type: string
        condition:
          type: string
        seller:
          type: string
        initials:
          type: string
        likes:
          type: integer
        comments:
          type: integer
        shares:
          type: integer
        saved:
          type: boolean
        liked:
          type: boolean
        images:
          type: array
          items:
            $ref: "#/components/schemas/StoredMedia"
        video:
          oneOf:
            - $ref: "#/components/schemas/StoredMedia"
            - type: "null"
        status:
          type: string
          enum: [pending, approved, rejected]
        moderationNote:
          type: ["string", "null"]
      required:
        - id
        - title
        - description
        - price
        - type
        - location
        - category
        - condition
        - seller
        - initials
        - likes
        - comments
        - shares
        - saved
        - liked
        - images
    MarketplacePostInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 4000
        price:
          type: number
          minimum: 0
        type:
          type: string
        location:
          type: string
        category:
          type: string
        condition:
          type: string
        seller:
          type: string
        initials:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/StoredMedia"
        video:
          oneOf:
            - $ref: "#/components/schemas/StoredMedia"
            - type: "null"
      required: [title, description, price, type, location, category, condition, seller, initials, images]
    ModerationInput:
      type: object
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        note:
          type: ["string", "null"]
      required: [status]
    MediaUploadInput:
      type: object
      properties:
        name:
          type: string
        size:
          type: number
          minimum: 1
        contentType:
          type: string
      required: [name, size, contentType]
    MediaUploadResponse:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
      required: [uploadURL, objectPath]

